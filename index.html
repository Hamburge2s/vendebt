<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6d26a">
  <title>Vendebt</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat day"><span class="k">Day</span><span id="day">1</span></div>
      <div class="stat money"><span class="k">Cash</span><span id="money">$0</span></div>
      <div class="stat debt"><span class="k">Debt</span><span id="debt">$9,999</span></div>
      <button id="test-btn" class="icon-btn" aria-label="Test panel" title="Test">⚙</button>
    </header>
    <main id="stage">
      <canvas id="game-canvas" width="500" height="800"></canvas>
      <div id="overlay-layer"></div>
      <div id="status-line">Set up your drinks, then start the day.</div>
    </main>
    <aside id="panel">
      <div class="panel-head">
        <h2>Drinks</h2>
        <span class="hint-small" id="hint">Pick a drink, then tap a slot</span>
      </div>
      <div id="drink-list" role="list"></div>
      <div class="panel-foot">
        <button id="start-day" class="primary">Start Day</button>
      </div>
    </aside>
    <div id="modal-root"></div>
  </div>
  <script src="vendor/matter.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
